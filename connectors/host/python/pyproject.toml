[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camarodiagconnectors"
version = "0.1.0"
requires-python = ">=3.11"
description = "CamaroDiagConnectors prototype host, discovery and offline memory tooling"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
camarodiagconnectors = "camarodiagconnectors.__main__:main"
camarodiagconnectors-offline = "camarodiagconnectors.offline_cli:main"
camarodiagconnectors-doip = "camarodiagconnectors.doip_cli:main"
camarodiagconnectors-j1979 = "camarodiagconnectors.j1979_cli:main"
camarodiagconnectors-j1979-network = "camarodiagconnectors.j1979_can_network_cli:main"
camarodiagconnectors-j1979-evap = "camarodiagconnectors.j1979_evap_cli:main"
camarodiagconnectors-j1979-clear = "camarodiagconnectors.j1979_clear_cli:main"
camarodiagconnectors-j1979-legacy = "camarodiagconnectors.j1979_legacy_cli:main"
camarodiagconnectors-j1979-legacy-mutation = "camarodiagconnectors.j1979_legacy_mutation_cli:main"
camarodiagconnectors-j1979-capture = "camarodiagconnectors.j1979_campaign_capture_cli:main"
camarodiagconnectors-j1979-usb = "camarodiagconnectors.j1979_usb_live_cli:main"

[tool.setuptools]
packages = ["camarodiagconnectors"]
