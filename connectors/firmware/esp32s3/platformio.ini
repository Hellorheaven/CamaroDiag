[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-binary-discovery]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -D CD_BINARY_DISCOVERY=1

; Isolated service build, no discovery or target commands. Do not erase NVS.
[env:esp32s3-journal-export]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -D CD_JOURNAL_EXPORT=1
