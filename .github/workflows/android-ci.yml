name: Android validation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --warning-mode=fail
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CamaroDiag-unit-tests-run-${{ github.run_number }}
          path: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Android lint
        run: ./gradlew app:lintDebug --stacktrace --warning-mode=fail
      - name: Reject Android lint warnings
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          report = pathlib.Path("app/build/reports/lint-results-debug.xml")
          if not report.is_file():
              print(f"Android lint report missing: {report}", file=sys.stderr)
              sys.exit(1)
          root = ET.parse(report).getroot()
          findings = [issue for issue in root.findall("issue")
                      if issue.get("severity", "").lower() in {"warning", "error"}]
          if findings:
              for issue in findings:
                  print(f"{issue.get('severity')}: {issue.get('id')}: {issue.get('message')}")
              sys.exit(1)
          print("Android lint clean: zero warnings and zero errors.")
          PY
      - name: Build debug APK
        run: ./gradlew app:assembleDebug --stacktrace --warning-mode=fail
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CamaroDiag-debug-run-${{ github.run_number }}
          path: app/build/outputs/apk/debug/CamaroDiag-debug.apk
          if-no-files-found: error
          retention-days: 30
