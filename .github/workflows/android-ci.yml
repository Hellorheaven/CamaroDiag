name: Android CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main

concurrency:
  group: android-debug-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  evaluate-build-checkpoint:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.checkpoint.outputs.build_required }}
      commits_since_build: ${{ steps.checkpoint.outputs.commits_since_build }}
      interval: ${{ steps.checkpoint.outputs.interval }}
    steps:
      - name: Evaluate flexible periodic build checkpoint
        id: checkpoint
        uses: actions/github-script@v8
        env:
          BUILD_INTERVAL: ${{ vars.CAMARODIAG_DRAFT_BUILD_INTERVAL }}
        with:
          script: |
            const configured = Number(process.env.BUILD_INTERVAL);
            const interval = Number.isInteger(configured) && configured > 0 ? configured : 50;
            const pr = context.payload.pull_request;
            if (!pr.draft) {
              core.setOutput('build_required', 'true');
              core.setOutput('commits_since_build', 'ready-for-review');
              core.setOutput('interval', String(interval));
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-ci.yml',
              branch: pr.head.ref,
              event: 'pull_request',
              status: 'completed',
              per_page: 100
            });
            const previous = runs
              .filter(run => run.conclusion === 'success' &&
                run.head_sha !== pr.head.sha &&
                (run.pull_requests || []).some(item => item.number === pr.number))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            let commitsSinceBuild = pr.commits;
            if (previous) {
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: previous.head_sha,
                  head: pr.head.sha
                });
                commitsSinceBuild = comparison.data.ahead_by;
              } catch (error) {
                core.warning(`Unable to compare against the last successful build (${error.message}); falling back to the PR commit count.`);
                commitsSinceBuild = pr.commits;
              }
            }

            const required = commitsSinceBuild >= interval;
            core.setOutput('build_required', String(required));
            core.setOutput('commits_since_build', String(commitsSinceBuild));
            core.setOutput('interval', String(interval));
            core.info(required
              ? `Periodic build due: ${commitsSinceBuild} commits since last successful build (interval ${interval}).`
              : `No periodic build due: ${commitsSinceBuild}/${interval} commits since last successful build.`);
            
  test-and-build:
    needs: evaluate-build-checkpoint
    if: needs.evaluate-build-checkpoint.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew app:lintDebug --stacktrace

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CamaroDiag-lint-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew app:assembleDebug --stacktrace

      - name: Upload debug APK for this PR commit
        uses: actions/upload-artifact@v7
        with:
          name: CamaroDiag-debug-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/debug/CamaroDiag-debug.apk
          if-no-files-found: error
          retention-days: 30
