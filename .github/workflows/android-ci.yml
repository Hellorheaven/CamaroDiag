name: Android CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: android-debug-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew app:lintDebug --stacktrace

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CamaroDiag-lint-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew app:assembleDebug --stacktrace

      - name: Upload debug APK for this PR commit
        uses: actions/upload-artifact@v7
        with:
          name: CamaroDiag-debug-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/debug/CamaroDiag-debug.apk
          if-no-files-found: error
          retention-days: 30
