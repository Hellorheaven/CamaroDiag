name: PC J2534 Bridge CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pc-bridge-debug-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  evaluate-build-checkpoint:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.checkpoint.outputs.build_required }}
      commits_since_build: ${{ steps.checkpoint.outputs.commits_since_build }}
      interval: ${{ steps.checkpoint.outputs.interval }}
    steps:
      - name: Evaluate flexible periodic build checkpoint
        id: checkpoint
        uses: actions/github-script@v8
        env:
          BUILD_INTERVAL: ${{ vars.CAMARODIAG_DRAFT_BUILD_INTERVAL }}
        with:
          script: |
            const configured = Number(process.env.BUILD_INTERVAL);
            const interval = Number.isInteger(configured) && configured > 0 ? configured : 50;
            const pr = context.payload.pull_request;
            if (!pr.draft) {
              core.setOutput('build_required', 'true');
              core.setOutput('commits_since_build', 'ready-for-review');
              core.setOutput('interval', String(interval));
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pc-bridge-ci.yml',
              branch: pr.head.ref,
              event: 'pull_request',
              status: 'completed',
              per_page: 100
            });
            const candidates = runs
              .filter(run => run.conclusion === 'success' &&
                run.head_sha !== pr.head.sha &&
                (run.pull_requests || []).some(item => item.number === pr.number))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            let previous = null;
            for (const candidate of candidates) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidate.id,
                per_page: 100
              });
              // A successful checkpoint means the actual platform build job passed.
              // The lightweight evaluator succeeding while the build job is skipped
              // must never reset the commit counter.
              if (jobs.data.jobs.some(job =>
                job.name === 'build-windows-debug' && job.conclusion === 'success')) {
                previous = candidate;
                break;
              }
            }

            let commitsSinceBuild = pr.commits;
            if (previous) {
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: previous.head_sha,
                  head: pr.head.sha
                });
                commitsSinceBuild = comparison.data.ahead_by;
              } catch (error) {
                core.warning(`Unable to compare against the last successful build (${error.message}); falling back to the PR commit count.`);
                commitsSinceBuild = pr.commits;
              }
            }

            const required = commitsSinceBuild >= interval;
            core.setOutput('build_required', String(required));
            core.setOutput('commits_since_build', String(commitsSinceBuild));
            core.setOutput('interval', String(interval));
            core.info(required
              ? `Periodic build due: ${commitsSinceBuild} commits since last successful build (interval ${interval}).`
              : `No periodic build due: ${commitsSinceBuild}/${interval} commits since last successful build.`);

  build-windows-debug:
    needs: evaluate-build-checkpoint
    if: needs.evaluate-build-checkpoint.outputs.build_required == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build J2534 bridge in Debug configuration
        run: dotnet build .\pc-bridge\CamaroDiag.J2534Bridge\CamaroDiag.J2534Bridge.csproj --configuration Debug
        continue-on-error: false

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Materialize CamaroDiag installer icon
        shell: pwsh
        run: |
          $encoded = (Get-Content ".\pc-bridge\installer\assets\CamaroDiag.ico.b64" -Raw).Trim()
          $bytes = [Convert]::FromBase64String($encoded)
          [System.IO.File]::WriteAllBytes(".\pc-bridge\installer\assets\CamaroDiag.ico", $bytes)

      - name: Publish and package Windows Debug installers
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }

          New-Item -ItemType Directory -Force -Path ".\dist" | Out-Null
          $variants = @(
            @{ Runtime = "win-x64"; Arch = "x64"; Name = "debug-win-x64" },
            @{ Runtime = "win-x86"; Arch = "x86"; Name = "debug-win-x86" }
          )

          foreach ($variant in $variants) {
            $output = Join-Path $PWD "publish\$($variant.Name)"
            New-Item -ItemType Directory -Force -Path $output | Out-Null

            dotnet publish .\pc-bridge\CamaroDiag.J2534Bridge\CamaroDiag.J2534Bridge.csproj --configuration Debug --runtime $variant.Runtime --self-contained true --output $output "-p:Version=0.0.0" "-p:AssemblyVersion=0.0.0.0" "-p:FileVersion=0.0.0.0"
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $($variant.Name)" }

            $outputName = "CamaroDiag-J2534-Bridge-Setup-debug-pr$env:PR_NUMBER-$($variant.Arch)"
            $installerLog = Join-Path $PWD "dist\$($variant.Name)-installer.log"
            $installerOutput = & $iscc "/DAppVersion=0.0.0" "/DBuildDir=$output" "/DChannel=debug" "/DArch=$($variant.Arch)" "/DOutputName=$outputName" ".\pc-bridge\installer\CamaroDiag.J2534Bridge.iss" 2>&1
            $installerOutput | Tee-Object -FilePath $installerLog
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $($variant.Name)" }
            if (($installerOutput | Out-String) -match '(?i)\bwarning\b') {
              throw "Inno Setup emitted a warning for $($variant.Name); warning-free Debug builds are mandatory. See $installerLog"
            }
          }

      - name: Upload Windows Debug installers for this PR commit
        uses: actions/upload-artifact@v7
        with:
          name: CamaroDiag-J2534-Bridge-debug-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            dist/CamaroDiag-J2534-Bridge-Setup-debug-pr${{ github.event.pull_request.number }}-x64.exe
            dist/CamaroDiag-J2534-Bridge-Setup-debug-pr${{ github.event.pull_request.number }}-x86.exe
          if-no-files-found: error
          retention-days: 30
