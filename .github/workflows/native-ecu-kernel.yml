name: Native ECU kernel tests
on:
  pull_request:
    paths:
      - 'ecu-native/**'
      - 'pc-bridge/CamaroDiag.J2534Bridge/Native*.cs'
      - '.github/workflows/native-ecu-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-flash-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Test native C components and cross-compile PowerPC objects
        run: bash ecu-native/mpc5566/verify.sh
