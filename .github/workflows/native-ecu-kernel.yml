name: Native ECU kernel tests
# Heavy tests are never triggered by pull_request synchronize.
# Run manually at ~50-commit checkpoints and before merging; ready_for_review is a final gate.
on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths:
      - 'ecu-native/**'
      - 'pc-bridge/CamaroDiag.J2534Bridge/Native*.cs'
      - '.github/workflows/native-ecu-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-flash-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Test native C components and cross-compile PowerPC objects
        run: bash ecu-native/mpc5566/verify.sh
