name: Native ECU kernel tests
# Heavy tests are never triggered by pull_request synchronize.
# Execute only at completed workstream/protocol acceptance; never at commit-count intervals.
on:
  # Manual component checkpoint only. Full PR check is orchestrated by pr-unit-tests.yml.
  # Disabled implicit PR triggers to prevent duplicate Debug validation.
  # No automatic runs per commit or Ready transition.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-flash-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Test native C components and cross-compile PowerPC objects
        run: bash ecu-native/mpc5566/verify.sh
