name: PR35 manual validation kickoff
# Checkpoint 7: validate CAN TX cancellation, J2534 disconnect and account-switch connection cleanup.

# One-time checkpoint: changing THIS file is the only push that requests builds.
# Ordinary source commits never trigger this workflow.
on:
  push:
    branches:
      - feat/live-can-monitor
    paths:
      - .github/workflows/pr35-validation-kickoff.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pr35-validation-kickoff
  cancel-in-progress: false

jobs:
  launch-both-chains:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android and Windows validation on one immutable SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Requesting Android and Windows validation of commit $TARGET_SHA"
          gh workflow run android-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/live-can-monitor \
            -f target_ref="$TARGET_SHA" -f pr_number=35
          gh workflow run pc-bridge-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/live-can-monitor \
            -f target_ref="$TARGET_SHA" -f pr_number=35
          echo "Both validation workflows dispatched for $TARGET_SHA"
