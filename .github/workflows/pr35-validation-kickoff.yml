name: PR54 full validation checkpoint
# Explicit full validation checkpoint: Android/Windows Debug + signed Release.
# Each push to this file (only) dispatches all chains on the same immutable SHA.

# One-time checkpoint: changing THIS file is the only push that requests builds.
# Ordinary source commits never trigger this workflow.
on:
  push:
    branches:
      - feat/flexfuel-lfx-2012
    paths:
      - .github/workflows/pr35-validation-kickoff.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pr54-validation-kickoff
  cancel-in-progress: false

jobs:
  launch-both-chains:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android and Windows validation on one immutable SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Requesting Android and Windows validation of commit $TARGET_SHA"
          gh workflow run android-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/flexfuel-lfx-2012 \
            -f target_ref="$TARGET_SHA" -f pr_number=54
          gh workflow run pc-bridge-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/flexfuel-lfx-2012 \
            -f target_ref="$TARGET_SHA" -f pr_number=54
          gh workflow run pr35-release-preflight.yml --repo "$GITHUB_REPOSITORY" --ref feat/flexfuel-lfx-2012 \
            -f target_ref="$TARGET_SHA"
          echo "Android Debug + Windows Debug + signed Android/Windows Release checkpoints dispatched for $TARGET_SHA"
          # Expose concrete run IDs to the PR, so the exact SHA can be checked
          # without pretending that dispatch equals a successful validation.
          REPORT="PR54 validation checkpoint requested on commit $TARGET_SHA"
          for WORKFLOW in android-ci.yml pc-bridge-ci.yml pr35-release-preflight.yml; do
            RUN_ID=""
            for ATTEMPT in $(seq 1 12); do
              RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow "$WORKFLOW" --branch feat/flexfuel-lfx-2012 \
                --event workflow_dispatch --limit 30 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)"
              if [[ -n "$RUN_ID" ]]; then break; fi
              sleep 5
            done
            if [[ -n "$RUN_ID" ]]; then
              REPORT="$REPORT
          - $WORKFLOW: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            else
              REPORT="$REPORT
          - $WORKFLOW: run not yet listed; check Actions manually"
            fi
          done
          REPORT="$REPORT
          
          Runs were dispatched, not yet confirmed successful. Inspect all jobs, lint warnings and test results before merging."
          printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
