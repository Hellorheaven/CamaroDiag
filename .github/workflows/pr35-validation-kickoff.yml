name: PR70 full validation checkpoint
# Final PR70 checkpoint: Android APIs 29–36, protected-sector regression, Debug + Release.
# A manual dispatch checks all chains on the same immutable SHA.

# Explicit manual checkpoint only; ordinary source commits do not trigger it.
on:
  # Trigger explicitly only. Editing this file must never dispatch
  # release/signing workflows automatically.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pr70-validation-kickoff
  cancel-in-progress: false

jobs:
  launch-both-chains:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android and Windows validation on one immutable SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Requesting Android and Windows validation of commit $TARGET_SHA"
          gh workflow run android-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/ecu-backup-integrity \
            -f target_ref="$TARGET_SHA" -f pr_number=70
          gh workflow run pc-bridge-ci.yml --repo "$GITHUB_REPOSITORY" --ref feat/ecu-backup-integrity \
            -f target_ref="$TARGET_SHA" -f pr_number=70
          gh workflow run pr35-release-preflight.yml --repo "$GITHUB_REPOSITORY" --ref feat/ecu-backup-integrity \
            -f target_ref="$TARGET_SHA"
          echo "Android Debug + Windows Debug + signed Android/Windows Release checkpoints dispatched for $TARGET_SHA"
          # Expose concrete run IDs to the PR, so the exact SHA can be checked
          # without pretending that dispatch equals a successful validation.
          REPORT="PR70 validation checkpoint requested on commit $TARGET_SHA"
          for WORKFLOW in android-ci.yml pc-bridge-ci.yml pr35-release-preflight.yml; do
            RUN_ID=""
            for ATTEMPT in $(seq 1 12); do
              RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow "$WORKFLOW" --branch feat/ecu-backup-integrity \
                --event workflow_dispatch --limit 30 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)"
              if [[ -n "$RUN_ID" ]]; then break; fi
              sleep 5
            done
            if [[ -n "$RUN_ID" ]]; then
              REPORT="$REPORT
          - $WORKFLOW: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            else
              REPORT="$REPORT
          - $WORKFLOW: run not yet listed; check Actions manually"
            fi
          done
          REPORT="$REPORT
          
          Runs were dispatched, not yet confirmed successful. Inspect all jobs, lint warnings and test results before merging."
          printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
