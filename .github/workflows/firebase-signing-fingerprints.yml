name: Firebase - Signing fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-fingerprints:
    name: Display public SHA-1 and SHA-256
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Java keytool
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read existing release signing certificate
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_STORE_PASSWORD" || -z "$SIGNING_KEY_ALIAS" ]]; then
            echo "::error::Missing one or more signing secrets (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS)."
            exit 1
          fi
          umask 077
          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          # Only public certificate hashes are printed. Never print the keystore or credentials.
          hashes="$(keytool -list -v -keystore "$keystore" -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" |
            grep -E '^[[:space:]]*SHA(1|256):[[:space:]]*[0-9A-Fa-f:]+' || true)"
          if [[ -z "$hashes" ]] || ! grep -q 'SHA1:' <<< "$hashes" || ! grep -q 'SHA256:' <<< "$hashes"; then
            echo "::error::Could not read both public SHA fingerprints from the configured signing certificate."
            exit 1
          fi
          printf '%s\n' "$hashes"
          {
            echo "## Firebase Android signing certificates"
            echo ""
            echo "Add these public fingerprints to both Firebase Android apps when both APK variants use this release certificate:"
            echo "- \`com.camarodiag.gen5\`"
            echo "- \`com.camarodiag.gen5.debug\` (only when signed with the same release keystore)"
            echo ""
            echo '~~~text'
            printf '%s\n' "$hashes"
            echo '~~~'
            echo ""
            echo "Firebase Console → Project settings → Your apps → SHA certificate fingerprints."
          } >> "$GITHUB_STEP_SUMMARY"
