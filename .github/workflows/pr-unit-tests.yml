name: PR unit tests
# Heavy tests are never triggered by pull_request synchronize.
# Run manually at ~50-commit checkpoints and before merging; ready_for_review is a final gate.
# Lightweight regression gate on PR changes. Full Android/Windows checkpoint
# remains explicitly launched through the existing manual CI workflows.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths:
      - 'app/**'
      - 'tools/admin/**'
      - 'functions/**'
      - 'functions-accounts/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'communication/**'
      - 'core/**'
      - 'diagnostic/**'
      - 'storage/**'
      - 'control/**'
      - 'mileageaudit/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/pr-unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Generate project wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Verify private two-account Firebase owner provisioning (offline)
        run: node --test tools/admin/enroll-functional-test-owner.test.mjs
      - name: Verify staged licensing backend policies without Firebase deployment
        run: node --test functions/licensing-policy.test.js
      - name: Verify dedicated Firebase account and license backend
        run: |
          node --check functions-accounts/index.js
          node --check functions-accounts/account-admin.js
          node --check functions-accounts/license-status.js
          node --check functions-accounts/entitlement-policy.js
          node --test functions-accounts/entitlement-policy.test.js
      - name: Execute Android unit tests (warnings fail)
        run: ./gradlew testDebugUnitTest --stacktrace --warning-mode=fail
      - name: Collect unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
