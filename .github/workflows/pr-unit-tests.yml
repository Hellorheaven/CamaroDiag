name: PR unit tests
# Lightweight regression gate on PR changes. Full Android/Windows checkpoint
# remains explicitly launched through the existing manual CI workflows.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'communication/**'
      - 'core/**'
      - 'diagnostic/**'
      - 'storage/**'
      - 'control/**'
      - 'mileageaudit/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/pr-unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Generate project wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Execute Android unit tests (warnings fail)
        run: ./gradlew testDebugUnitTest --stacktrace --warning-mode=fail
      - name: Collect unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
