name: PR unit tests
# Heavy tests are never triggered by pull_request synchronize.
# Run manually at ~50-commit checkpoints and before merging; ready_for_review is a final gate.
# Unit tests on ready-for-review. A manual checkpoint also runs Connectors
# and Android/Windows Release validation on the same revision.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact branch head for the full checkpoint (optional)"
        type: string
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths:
      - 'app/**'
      - 'tools/admin/**'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'communication/**'
      - 'core/**'
      - 'diagnostic/**'
      - 'storage/**'
      - 'control/**'
      - 'mileageaudit/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/pr-unit-tests.yml'

permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Require the requested immutable revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Requested SHA differs from the workflow dispatch revision."
            exit 1
          fi

  unit-tests:
    needs: verify-revision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Generate project wrapper
        run: gradle wrapper --gradle-version 8.11.1
      - name: Verify private two-account Firebase owner provisioning (offline)
        run: node --test tools/admin/enroll-functional-test-owner.test.mjs
      - name: Verify Firebase account and license backend
        run: |
          node --check functions/index.js
          node --check functions/account-admin.js
          node --check functions/license-status.js
          node --check functions/entitlement-policy.js
          node --test functions/entitlement-policy.test.js functions/account-policy.test.js
      - name: Execute Android unit tests (warnings fail)
        run: ./gradlew testDebugUnitTest --stacktrace --warning-mode=fail
      - name: Collect unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-tests-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14

  connectors:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-revision
    uses: ./.github/workflows/connectors-ci.yml

  release-validation:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-revision
    uses: ./.github/workflows/release-validation.yml
