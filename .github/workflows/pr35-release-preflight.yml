name: PR54 Release size and compatibility checkpoint
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact branch or commit to validate"
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build and self-test Release bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\pc-bridge\CamaroDiag.J2534Bridge\CamaroDiag.J2534Bridge.csproj --configuration Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Release bridge build failed' }
          dotnet run --project .\pc-bridge\CamaroDiag.J2534Bridge\CamaroDiag.J2534Bridge.csproj --configuration Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Release bridge self-test failed' }
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Restore Release signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release.jks
          test -s app/release.jks
      - name: Lint, unit tests and signed Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug lintRelease app:assembleRelease --stacktrace --warning-mode=fail
      - name: Reject lint warnings in all modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          problems = []
          for module in ('app','core','diagnostic','communication','storage','control','mileageaudit'):
              for variant in ('debug','release'):
                  path = Path(module) / 'build/reports' / f'lint-results-{variant}.xml'
                  if not path.is_file():
                      problems.append(f'Missing {path}')
                      continue
                  for issue in ElementTree.parse(path).getroot().findall('issue'):
                      if issue.get('severity','').lower() in ('warning','error','fatal'):
                          problems.append(f"{path}: {issue.get('id')}: {issue.get('message')}")
          if problems: raise SystemExit('\n'.join(problems))
          print('Release/Debug lint: zero warnings')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr54-release-optimization-results
          path: |
            app/build/outputs/apk/release/*.apk
            **/build/reports/lint-results-*.xml
            **/build/test-results/testDebugUnitTest/**
