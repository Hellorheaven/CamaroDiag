name: Release validation (no publication)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build and self-test Release bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\pc-bridge\CamaroDiag.J2534Bridge\CamaroDiag.J2534Bridge.csproj --configuration Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Release bridge build failed' }
          dotnet run --project .\pc-bridge\CamaroDiag.J2534Bridge\CamaroDiag.J2534Bridge.csproj --configuration Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Release bridge self-test failed' }
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Build Release APK with a temporary test key
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: checkpoint
          SIGNING_KEY_PASSWORD: android
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore app/release.jks -storetype JKS \
            -storepass "$SIGNING_STORE_PASSWORD" -keypass "$SIGNING_KEY_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -dname 'CN=CamaroDiag CI checkpoint' -validity 1 -noprompt
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug lintRelease app:assembleRelease --stacktrace --warning-mode=fail
      - name: Verify the APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --Werr --verbose \
            app/build/outputs/apk/release/CamaroDiag-release.apk
      - name: Reject lint warnings in all modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          problems = []
          for module in ('app','core','diagnostic','communication','storage','control','mileageaudit'):
              for variant in ('debug','release'):
                  path = Path(module) / 'build/reports' / f'lint-results-{variant}.xml'
                  if not path.is_file():
                      problems.append(f'Missing {path}')
                      continue
                  for issue in ElementTree.parse(path).getroot().findall('issue'):
                      if issue.get('severity','').lower() in ('warning','error','fatal'):
                          problems.append(f"{path}: {issue.get('id')}: {issue.get('message')}")
          if problems: raise SystemExit('\n'.join(problems))
          print('Release/Debug lint: zero warnings')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-validation-${{ github.sha }}
          path: |
            **/build/reports/lint-results-*.xml
            **/build/test-results/testDebugUnitTest/**
