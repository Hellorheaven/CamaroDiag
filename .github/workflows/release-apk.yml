name: Release APKs to GitHub Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: camaro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Determine next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_PREFIX="$(sed -n 's/^VERSION_PREFIX=//p' version.properties | head -n 1 | tr -d '\r')"
          VERSION_CODE_BASE="$(sed -n 's/^VERSION_CODE_BASE=//p' version.properties | head -n 1 | tr -d '\r')"

          if [[ ! "$VERSION_PREFIX" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION_PREFIX must use MAJOR.MINOR format (for example 1.6)." >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE_BASE" =~ ^[0-9]+$ ]]; then
            echo "VERSION_CODE_BASE must be a positive integer." >&2
            exit 1
          fi

          PREFIX_PATTERN="${VERSION_PREFIX//./\\.}"
          LAST_PATCH="$(git tag --list "v${VERSION_PREFIX}.*" | sed -nE "s/^v${PREFIX_PATTERN}\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"

          if [[ -z "$LAST_PATCH" ]]; then
            NEXT_PATCH=0
          else
            NEXT_PATCH=$((LAST_PATCH + 1))
          fi

          VERSION_CODE=$((VERSION_CODE_BASE + NEXT_PATCH))
          VERSION_NAME="${VERSION_PREFIX}.${NEXT_PATCH}"
          TAG_NAME="v${VERSION_NAME}"

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Tag ${TAG_NAME} already exists; refusing to overwrite a release." >&2
            exit 1
          fi

          echo "prefix=${VERSION_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "patch=${NEXT_PATCH}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          echo "Release: ${TAG_NAME} (versionCode ${VERSION_CODE})"

      - name: Decode signing keystore
        run: |
          mkdir -p app
          printf "%s" "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          test -s app/release.jks

      - name: Generate Gradle wrapper and build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RELEASE_PATCH: ${{ steps.version.outputs.patch }}
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PreleasePatch="$RELEASE_PATCH" --stacktrace
          ./gradlew app:assembleDebug -PreleasePatch="$RELEASE_PATCH" --stacktrace
          ./gradlew app:assembleRelease -PreleasePatch="$RELEASE_PATCH" --stacktrace

      - name: Create Git tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Publish release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CamaroDiag - Release ${{ steps.version.outputs.tag }}"
          body: |
            ## CamaroDiag • Chevrolet Camaro Gen 5 & Gen 6
            - Version: ${{ steps.version.outputs.version_name }}
            - Android versionCode: ${{ steps.version.outputs.version_code }}
            - Signed debug and release APKs are attached.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
