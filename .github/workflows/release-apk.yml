name: Release CamaroDiag

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'communication/**'
      - 'core/**'
      - 'diagnostic/**'
      - 'storage/**'
      - 'control/**'
      - 'mileageaudit/**'
      - 'pc-bridge/**'
      - 'ecu-native/**'
      - 'third_party/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'global.json'
      - '**/*.props'
      - '**/*.targets'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful SAE J1979 final acceptance run (required for PR 117)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: camaro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-source:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/unified-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Verify the accepted PR revision and protocol
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@v8
        env:
          ACCEPTANCE_ID: ${{ inputs.acceptance_run_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const id = process.env.ACCEPTANCE_ID;
            if (!/^[1-9][0-9]*$/.test(id)) throw Error('A final acceptance run ID is required');
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: 117});
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: id});
            if (pr.state !== 'open' || pr.head.repo.full_name !== owner + '/' + repo ||
                pr.head.ref !== 'chore/unified-ci' || pr.head.sha !== context.sha ||
                run.event !== 'push' || run.path !== '.github/workflows/pr-unit-tests.yml' ||
                run.head_sha !== context.sha || run.head_branch !== pr.head.ref ||
                run.status !== 'completed' || run.conclusion !== 'success') {
              throw Error('The selected run must validate the current head of PR 117');
            }
            const {data: marker} = await github.rest.repos.getContent({
              owner, repo, ref: context.sha, path: '.github/ci-final-checkpoint-request.txt'
            });
            const lines = Buffer.from(marker.content, 'base64').toString('utf8').split(/\r?\n/);
            if (lines[0] !== 'scope: protocol' || !lines.includes('protocol: SAE J1979')) {
              throw Error('Expected the SAE J1979 final acceptance marker');
            }
      - name: Accept main release source
        if: github.ref == 'refs/heads/main'
        run: echo "Building main revision $GITHUB_SHA"

  windows-preflight:
    needs: authorize-source
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Verify J2534 bridge release compilation and offline self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\\pc-bridge\\CamaroDiag.J2534Bridge\\CamaroDiag.J2534Bridge.csproj --configuration Release -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Bridge Release compilation failed' }
          dotnet run --project .\\pc-bridge\\CamaroDiag.J2534Bridge\\CamaroDiag.J2534Bridge.csproj --configuration Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'J2534 Release self-tests failed' }

  release:
    needs: windows-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 14742923
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Determine next release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_PREFIX="$(sed -n 's/^VERSION_PREFIX=//p' version.properties | head -n 1 | tr -d '\r')"
          VERSION_CODE_BASE="$(sed -n 's/^VERSION_CODE_BASE=//p' version.properties | head -n 1 | tr -d '\r')"

          if [[ ! "$VERSION_PREFIX" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION_PREFIX must use MAJOR.MINOR format (for example 1.6)." >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE_BASE" =~ ^[0-9]+$ ]]; then
            echo "VERSION_CODE_BASE must be a positive integer." >&2
            exit 1
          fi

          PREFIX_PATTERN="${VERSION_PREFIX//./\\.}"
          LAST_PATCH="$(git tag --list "v${VERSION_PREFIX}.*" | sed -nE "s/^v${PREFIX_PATTERN}\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"

          if [[ -z "$LAST_PATCH" ]]; then
            NEXT_PATCH=0
          else
            NEXT_PATCH=$((LAST_PATCH + 1))
          fi

          VERSION_CODE=$((VERSION_CODE_BASE + NEXT_PATCH))
          VERSION_NAME="${VERSION_PREFIX}.${NEXT_PATCH}"
          TAG_NAME="v${VERSION_NAME}"
          if [[ "$GITHUB_REF" != refs/heads/main && ( "$TAG_NAME" != v2.0.47 || "$VERSION_CODE" != 64 ) ]]; then
            echo "::error::PR 117 is authorized for v2.0.47 (64) only."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Tag ${TAG_NAME} already exists; refusing to overwrite a release." >&2
            exit 1
          fi

          echo "prefix=${VERSION_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "patch=${NEXT_PATCH}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          echo "Release: ${TAG_NAME} (versionCode ${VERSION_CODE})"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          printf "%s" "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release.jks
          test -s app/release.jks

      - name: Generate Gradle wrapper, test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RELEASE_PATCH: ${{ steps.version.outputs.patch }}
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PreleasePatch="$RELEASE_PATCH" --stacktrace --warning-mode=fail
          ./gradlew lintDebug lintRelease -PreleasePatch="$RELEASE_PATCH" --stacktrace --warning-mode=fail
          ./gradlew app:assembleRelease -PreleasePatch="$RELEASE_PATCH" --stacktrace --warning-mode=fail

      - name: Report release APK size and largest packaged entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apks = sorted(Path("app/build/outputs/apk/release").glob("*.apk"))
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one release APK, found {len(apks)}")
          apk = apks[0]
          print(f"Release APK: {apk.name} ({apk.stat().st_size / 1048576:.2f} MiB)")
          with ZipFile(apk) as archive:
              for item in sorted(archive.infolist(), key=lambda entry: entry.compress_size, reverse=True)[:20]:
                  print(f"{item.compress_size / 1048576:.2f} MiB  {item.filename}")
          PY

      - name: Reject Android lint errors and warnings in every release variant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          modules = ("app", "core", "diagnostic", "communication", "storage", "control", "mileageaudit")
          failures = []
          for module in modules:
              for variant in ("debug", "release"):
                  report = Path(module) / f"build/reports/lint-results-{variant}.xml"
                  if not report.is_file():
                      failures.append(f"Missing {report}")
                      continue
                  for issue in ElementTree.parse(report).getroot().findall("issue"):
                      if issue.get("severity", "").lower() in {"warning", "error", "fatal"}:
                          failures.append(f"{report}: {issue.get('id')}: {issue.get('message')}")
          if failures:
              raise SystemExit("\\n".join(failures))
          print("Android Release/Debug lint: zero warnings or errors in all modules.")
          PY

      - name: Verify the production APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --Werr --verbose \
            app/build/outputs/apk/release/CamaroDiag-release.apk

      - name: Attest APK build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: app/build/outputs/apk/release/CamaroDiag-release.apk

      - name: Create Git tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Stage Android APK on a draft release
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CamaroDiag - Release ${{ steps.version.outputs.tag }}"
          body: |
            ## CamaroDiag • Chevrolet Camaro Gen 5 & Gen 6
            - Version: ${{ steps.version.outputs.version_name }}
            - Android versionCode: ${{ steps.version.outputs.version_code }}
            - Signed Android release APK.
            - Windows J2534 Bridge release installers for x64 and x86.
            - VX Manager and the manufacturer's J2534 driver must be installed separately by an administrator when required.
            - GitHub may also show automatic source-code archives (zip/tar.gz); these are not Windows installers. Download the .exe Setup or Android .apk assets only.
          files: |
            app/build/outputs/apk/release/*.apk
          draft: true
          fail_on_unmatched_files: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bridge-installers:
    needs: release
    if: needs.release.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the same source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          } else {
            Write-Host "Inno Setup is already available: $iscc"
          }

      - name: Materialize CamaroDiag installer icon
        shell: pwsh
        run: |
          $encoded = (Get-Content ".\pc-bridge\installer\assets\CamaroDiag.ico.b64" -Raw).Trim()
          $bytes = [Convert]::FromBase64String($encoded)
          [System.IO.File]::WriteAllBytes(".\pc-bridge\installer\assets\CamaroDiag.ico", $bytes)

      - name: Build Windows release setup installers
        env:
          VERSION_NAME: ${{ needs.release.outputs.version_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }

          New-Item -ItemType Directory -Force -Path ".\dist" | Out-Null
          $variants = @(
            @{ Runtime = "win-x64"; Arch = "x64"; Name = "release-win-x64" },
            @{ Runtime = "win-x86"; Arch = "x86"; Name = "release-win-x86" }
          )

          foreach ($variant in $variants) {
            $output = Join-Path $PWD "publish\$($variant.Name)"
            New-Item -ItemType Directory -Force -Path $output | Out-Null

            dotnet publish .\pc-bridge\CamaroDiag.J2534Bridge\CamaroDiag.J2534Bridge.csproj --configuration Release --runtime $variant.Runtime --self-contained true --output $output -warnaserror "-p:Version=$env:VERSION_NAME" "-p:AssemblyVersion=$($env:VERSION_NAME).0" "-p:FileVersion=$($env:VERSION_NAME).0"
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $($variant.Name)" }
            $publishedExe = Join-Path $output 'CamaroDiag.J2534Bridge.exe'
            & $publishedExe --self-test
            if ($LASTEXITCODE -ne 0) { throw "Published $($variant.Arch) bridge self-tests failed" }

            $installerLog = Join-Path $PWD "dist\$($variant.Name)-installer.log"
            $installerOutput = & $iscc "/DAppVersion=$env:VERSION_NAME" "/DBuildDir=$output" "/DChannel=release" "/DArch=$($variant.Arch)" "/DOutputName=CamaroDiag-J2534-Bridge-Setup-$($variant.Name)" ".\pc-bridge\installer\CamaroDiag.J2534Bridge.iss" 2>&1
            $installerOutput | Tee-Object -FilePath $installerLog
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $($variant.Name)" }
            if (($installerOutput | Out-String) -match '(?i)\bwarning\b') {
              throw "Inno Setup emitted a warning for $($variant.Name). See $installerLog"
            }
          }

      - name: Upload Windows installers to the draft release
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          draft: true
          files: |
            dist/CamaroDiag-J2534-Bridge-Setup-release-win-x64.exe
            dist/CamaroDiag-J2534-Bridge-Setup-release-win-x86.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false --repo "$env:GITHUB_REPOSITORY"

  cleanup-merged-pr-branch:
    name: Delete merged branch only after successful main Release
    needs: [windows-preflight, release, bridge-installers]
    if: ${{ github.ref == 'refs/heads/main' && needs.bridge-installers.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete reviewed source branch only if this release contains its merge
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const commitSha = context.sha;
            const result = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: commitSha, per_page: 100
            });
            const merged = result.data.filter(pr =>
              pr.merged_at && pr.base.ref === 'main' &&
              pr.head.repo?.full_name === owner + '/' + repo &&
              pr.head.ref !== 'main' &&
              pr.merge_commit_sha === commitSha
            );
            if (merged.length !== 1) {
              core.notice('No unique merged PR for this Release SHA; branch preserved.');
              return;
            }
            const pr = merged[0], branch = pr.head.ref;
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: owner + ':' + branch, per_page: 100
            });
            if (open.length) {
              core.notice('Branch is still in use by an open PR; preserved.');
              return;
            }
            let current;
            try {
              current = await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch});
            } catch (error) {
              if (error.status === 404) {
                core.info('Merged branch already removed.');
                return;
              }
              throw error;
            }
            if (current.data.object.sha !== pr.head.sha) {
              core.notice('Branch advanced since merge; preserved for safety.');
              return;
            }
            await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + branch});
            core.info('Successful Release for merge ' + commitSha + ': removed merged branch ' + branch);
